version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ems_db
      JWT_SECRET: change_this_in_production
      JWT_EXPIRES_IN: 1d
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
      SEED_ADMIN_EMAIL: admin@ems.com
      SEED_ADMIN_PASSWORD: Admin@12345
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo-data:
